# Acumula roles definidos en todos los perfiles.
# (roles = aplicaciones más complejas de instalar
#          con su propio role de instalación )
#
# Se asegura que el mismo role no aparece dos veces.
#
# Ejemplo:
#
# base:
#   docker
#
# programacion:
#   virtualbox
#
# Resultado:
#
# docker + virtualbox


# VOLVER A DOCUMENTAR
- name: Acumular roles
  set_fact:
    software_roles: >-
      {{
        software_roles
        + (item.ansible_facts.current_profile.roles | default([]))
      }}
  loop: "{{ loaded_profiles.results }}"

- name: Normalizar roles (último gana)
  set_fact:
    software_roles: >-
      {{
        software_roles
        | reverse
        | unique(attribute='name')
        | reverse
      }}
      
- name: DEBUG roles finales
  debug:
    var: software_roles

# Muestra listas resultantes para depuración.
#
# Útil para verificar combinación de perfiles.
  
- debug:
    msg:
      apt: "{{ software_apt }}"
      snap: "{{ software_snap }}"
      flatpak: "{{ software_flatpak }}"
      deb: "{{ software_deb }}"
      roles: "{{ software_roles }}"
