# Inicializa listas vacías donde se acumularán paquetes
# procedentes de múltiples perfiles.
#
# Esto permite combinar:
#
# base + modulo/asignatura X + profesor Y
#
# en una única ejecución.

- name: Inicializar listas
  set_fact:
    software_apt: []
    software_snap: []
    software_flatpak: []
    software_deb: []
    software_roles: []

# Cada perfil puede definir software de distintos tipos.
#
# Se cargan dinámicamente y posteriormente se unifican
# en listas acumuladas.
#
# Esto permite construir perfiles reutilizables y
# combinables entre sí.

# Carga dinámicamente cada perfil.
#
# include_vars importa variables desde YAML y las guarda
# temporalmente en:
#
# current_profile

- name: Leer perfiles
  include_vars:
    file: "{{ software_repository }}/{{ item }}.yml"
    name: current_profile
  loop: "{{ software_profiles }}"
  register: loaded_profiles

# Acumula software APT definido en todos los perfiles.
#
# Se asegura que la misma aplicación no aparece dos veces.
#
# Ejemplo:
#
# base:
#   firefox
#
# programacion:
#   netbeans
#
# Resultado:
#
# firefox + netbeans

- name: Acumular paquetes apt
  set_fact:
    software_apt: >-
      {{
        (
          software_apt
          + (item.ansible_facts.current_profile.apt | default([]))
        )
        | unique
      }}
  loop: "{{ loaded_profiles.results }}"
 

# Acumula software snap definido en todos los perfiles.
#
# Se asegura que la misma aplicación no aparece dos veces.
#
# Ejemplo:
#
